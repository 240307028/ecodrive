<!DOCTYPE html>
<html class="dark" lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoDrive - Kullanıcılar</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"class",theme:{extend:{colors:{surface:"#0b1326",primary:"#4edea3","on-surface":"#dae2fd","on-surface-variant":"#bbcabf","surface-container":"#171f33","surface-container-low":"#131b2e","surface-container-high":"#222a3d"},fontFamily:{headline:["Plus Jakarta Sans"],body:["Inter"]}}}};</script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0}.panel{border-radius:.75rem;background:#171f33;padding:1.5rem}</style></head><body class="bg-surface text-on-surface font-body min-h-screen"><header class="h-16 px-6 flex items-center justify-between bg-surface-container-low"><a href="admin.html" class="text-primary font-headline font-bold">← Yönetim Merkezi</a><button onclick="logout()" class="text-sm bg-surface-container-high px-3 py-2 rounded-lg">Çıkış Yap</button></header><main class="max-w-6xl mx-auto px-4 py-8"><h1 class="font-headline text-3xl font-bold">Kullanıcı Görüntüleme</h1><p class="text-on-surface-variant mt-2">Kayıtlı kullanıcıların ve topluluk yorumlarının ayrıntılı özetini görüntüleyin.</p><div id="metrics" class="grid sm:grid-cols-3 gap-4 mt-6"></div><section class="panel mt-6 overflow-x-auto"><h2 class="font-headline text-xl font-bold mb-3">Kayıtlı Kullanıcılar</h2><table class="w-full text-left text-sm"><thead class="text-primary"><tr><th class="p-3">Ad Soyad</th><th class="p-3">E-posta</th><th class="p-3">Analiz Sayısı</th><th class="p-3">Son Analiz</th><th class="p-3">Araçlar</th></tr></thead><tbody id="userList"></tbody></table><p id="empty" class="text-on-surface-variant hidden p-3">Henüz kayıtlı kullanıcı yok.</p></section><section class="panel mt-6"><h2 class="font-headline text-xl font-bold mb-3">Kullanıcı Yorumları</h2><div id="reviewList" class="space-y-3"></div><p id="emptyReviews" class="text-on-surface-variant hidden">Henüz yorum yapılmamış.</p></section></main><script>
function auth(){if(localStorage.getItem("ecodriveAdminAuthenticated")!=="true")window.location.href="admin.html"}function logout(){localStorage.removeItem("ecodriveAdminAuthenticated");window.location.href="admin.html"}function load(){var users=JSON.parse(localStorage.getItem("ecodriveUsers")||"[]"),reviews=JSON.parse(localStorage.getItem("ecodriveReviews")||"[]"),analyses=users.reduce(function(sum,u){return sum+(u.history||[]).length},0);document.getElementById("metrics").innerHTML='<div class="panel"><span class="text-on-surface-variant text-sm">Kullanıcı sayısı</span><strong class="block text-3xl text-primary mt-2">'+users.length+'</strong></div><div class="panel"><span class="text-on-surface-variant text-sm">Toplam analiz</span><strong class="block text-3xl text-primary mt-2">'+analyses+'</strong></div><div class="panel"><span class="text-on-surface-variant text-sm">Toplam yorum</span><strong class="block text-3xl text-primary mt-2">'+reviews.length+'</strong></div>';if(!users.length){document.getElementById("empty").classList.remove("hidden")}else{document.getElementById("userList").innerHTML=users.map(function(u){var history=u.history||[],last=history[0],vehicles=history.map(function(item){return item.model||item.vehicle&&item.vehicle.model}).filter(Boolean).slice(0,3).join(", ")||"-";return '<tr class="border-t border-surface-container-high align-top"><td class="p-3 font-semibold">'+escapeHtml(u.name||"-")+'</td><td class="p-3">'+escapeHtml(u.email||"-")+'</td><td class="p-3">'+history.length+'</td><td class="p-3">'+escapeHtml(last&&last.date||"-")+'</td><td class="p-3 text-on-surface-variant">'+escapeHtml(vehicles)+'</td></tr>'}).join("")}if(!reviews.length){document.getElementById("emptyReviews").classList.remove("hidden")}else{document.getElementById("reviewList").innerHTML=reviews.map(function(review){var stars="★".repeat(Number(review.rating)||0);return '<article class="rounded-lg bg-surface-container-low p-4"><div class="flex flex-wrap items-center justify-between gap-2"><strong>'+escapeHtml(review.name||"İsimsiz kullanıcı")+'</strong><span class="text-tertiary">'+stars+'</span></div><p class="text-sm text-on-surface-variant mt-1">'+escapeHtml(review.vehicle||"Araç bilgisi yok")+'</p><p class="mt-2">'+escapeHtml(review.message||"Yorum metni yok")+'</p></article>'}).join("")}}function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(char){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]})}auth();load();
</script></body></html>
